<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TALAT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    img.logo {
      width: min(35vw, 700px); /* comfy on laptops/desktops */
      height: auto;
      max-height: 80vh;
      display: block;
    }

    /* Make the logo larger on mobiles while still centred */
    @media (max-width: 768px) {
      img.logo {
        width: 60vw;
        max-height: 60vh;
      }
    }
  </style>
</head>
<body>
  <img
    src="TALAT_Monogram_3900_black_on_white.png"
    alt="TALAT logo"
    class="logo"
  />
</body>
</html>
